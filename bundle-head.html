<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CashFlow Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* Cash Flow Management — Minimal enterprise (Linear/Notion-inspired) */

:root {
  /* Neutral scale */
  --bg: #FFFFFF;
  --bg-subtle: #FAFBFC;
  --bg-muted: #F6F7F9;
  --bg-hover: #F1F2F4;
  --bg-active: #EAECEF;
  --sidebar-bg: #FAFBFC;

  /* Border */
  --border: #E6E8EB;
  --border-strong: #D5D9DE;

  /* Text */
  --text: #1A1D21;
  --text-secondary: #5C6470;
  --text-tertiary: #8B95A1;
  --text-on-accent: #FFFFFF;

  /* Accent (blue) */
  --accent: #2A6FF0;
  --accent-hover: #1F5BD8;
  --accent-soft: #EAF1FE;
  --accent-soft-strong: #D6E4FD;
  --accent-text: #1F5BD8;

  /* Semantic */
  --success: #1F9D55;
  --success-soft: #E6F5EC;
  --danger: #D03434;
  --danger-soft: #FBEAEA;
  --warning: #C97A00;
  --warning-soft: #FBF1DD;

  /* Layout */
  --sidebar-width: 248px;
  --topbar-h: 52px;
  --radius-sm: 4px;
  --radius: 6px;
  --radius-lg: 10px;

  /* Density */
  --row-h: 36px;
  --pad: 14px;
  --font-base: 13.5px;

  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
  --shadow: 0 4px 12px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.04);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.12), 0 2px 6px rgba(16, 24, 40, 0.06);
}

[data-density="compact"] {
  --row-h: 30px;
  --pad: 10px;
  --font-base: 12.5px;
}
[data-density="comfortable"] {
  --row-h: 42px;
  --pad: 18px;
  --font-base: 14.5px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: var(--font-base);
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button {
  font-family: inherit;
  font-size: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

.mono, .num {
  font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  font-variant-numeric: tabular-nums;
}

/* ---------- Layout ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  height: 100vh;
  overflow: hidden;
}
.app[data-sidebar="right"] {
  grid-template-columns: 1fr var(--sidebar-width);
}
.app[data-sidebar="right"] .sidebar {
  order: 2;
  border-right: none;
  border-left: 1px solid var(--border);
}

.sidebar {
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sb-brand {
  padding: 16px 18px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}
.sb-logo {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  background: var(--accent);
  display: grid;
  place-items: center;
  color: white;
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}
.sb-brand-name {
  font-weight: 600;
  font-size: 13.5px;
  line-height: 1.2;
}
.sb-brand-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 1px;
}

.sb-section {
  padding: 14px 10px 4px;
}
.sb-section-label {
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 4px 10px 8px;
  font-weight: 500;
}
.sb-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 10px;
  margin: 1px 0;
  border-radius: var(--radius);
  color: var(--text-secondary);
  font-size: 13px;
  width: 100%;
  text-align: left;
  cursor: pointer;
  user-select: none;
  transition: background 0.08s;
}
.sb-item:hover { background: var(--bg-hover); color: var(--text); }
.sb-item.active {
  background: var(--bg-active);
  color: var(--text);
  font-weight: 500;
}
.sb-item .ic { flex-shrink: 0; opacity: 0.85; }
.sb-item-badge {
  margin-left: auto;
  font-size: 11px;
  background: var(--bg-hover);
  color: var(--text-secondary);
  padding: 1px 6px;
  border-radius: 10px;
  font-variant-numeric: tabular-nums;
}
.sb-item.active .sb-item-badge {
  background: var(--bg);
  color: var(--text);
}

.sb-spacer { flex: 1; }
.sb-footer {
  padding: 10px 14px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-secondary);
}
.sb-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c7d4f0, #94a8c9);
  color: white;
  display: grid;
  place-items: center;
  font-weight: 600;
  font-size: 11px;
}

/* ---------- Main ---------- */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.topbar {
  height: var(--topbar-h);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 22px;
  gap: 14px;
  flex-shrink: 0;
  background: var(--bg);
}
.crumbs {
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.crumbs .sep { color: var(--text-tertiary); }
.crumbs .here { color: var(--text); font-weight: 500; }
.tb-spacer { flex: 1; }

.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}
.page {
  padding: 24px 28px 60px;
  max-width: 1480px;
  margin: 0 auto;
  width: 100%;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
}
.page-title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
}
.page-sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin: 0;
}
.page-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  font-size: 13px;
  border-radius: var(--radius);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  color: var(--text);
  font-weight: 500;
  transition: background 0.08s, border 0.08s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-hover); }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--text-on-accent);
}
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost {
  background: transparent;
  border-color: transparent;
}
.btn.ghost:hover { background: var(--bg-hover); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger-soft); }
.btn .ic { opacity: 0.7; }
.btn.primary .ic { opacity: 1; }

.iconbtn {
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  color: var(--text-secondary);
  border: 1px solid transparent;
}
.iconbtn:hover { background: var(--bg-hover); color: var(--text); }

/* ---------- Input ---------- */
.input, .select {
  display: inline-flex;
  align-items: center;
  height: 30px;
  padding: 0 10px;
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  font-size: 13px;
  outline: none;
  min-width: 0;
  color: var(--text);
}
.input:focus, .select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input.search { padding-left: 30px; }
.search-wrap { position: relative; display: inline-flex; align-items: center; }
.search-wrap .search-ic { position: absolute; left: 9px; color: var(--text-tertiary); pointer-events: none; }

label.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--text-secondary);
}
label.field .input,
label.field .select,
label.field textarea {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
label.field textarea {
  min-height: 70px;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--bg);
  font-family: inherit;
  resize: vertical;
}

/* ---------- Card ---------- */
.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.card-pad { padding: var(--pad); }
.card-head {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-title {
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
}
.card-sub {
  font-size: 12px;
  color: var(--text-secondary);
}

/* ---------- KPI cards ---------- */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.kpi {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.kpi-label {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.kpi-value {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.kpi-delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-secondary);
}
.kpi-delta .up { color: var(--success); font-weight: 500; }
.kpi-delta .down { color: var(--danger); font-weight: 500; }

/* ---------- Table ---------- */
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.tbl th {
  text-align: left;
  font-weight: 500;
  font-size: 12px;
  color: var(--text-secondary);
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-subtle);
  white-space: nowrap;
}
.tbl td {
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  height: var(--row-h);
  vertical-align: middle;
}
.tbl tbody tr:hover { background: var(--bg-subtle); }
.tbl .num {
  text-align: right;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}
.tbl th.num { text-align: right; }
.tbl.dense td { height: 30px; }

/* tag / badge / chip */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 11.5px;
  font-weight: 500;
  background: var(--bg-hover);
  color: var(--text-secondary);
  white-space: nowrap;
}
.tag.success { background: var(--success-soft); color: var(--success); }
.tag.danger { background: var(--danger-soft); color: var(--danger); }
.tag.warning { background: var(--warning-soft); color: var(--warning); }
.tag.accent { background: var(--accent-soft); color: var(--accent-text); }
.tag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.pos { color: var(--success); }
.neg { color: var(--danger); }

/* Tabs */
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
}
.tab {
  padding: 8px 14px;
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }

/* Segmented */
.segmented {
  display: inline-flex;
  background: var(--bg-muted);
  border-radius: var(--radius);
  padding: 2px;
  gap: 2px;
}
.segmented button {
  height: 26px;
  padding: 0 10px;
  font-size: 12.5px;
  color: var(--text-secondary);
  border-radius: 4px;
  font-weight: 500;
}
.segmented button:hover { color: var(--text); }
.segmented button.active {
  background: var(--bg);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

/* Toast */
.toast-host {
  position: fixed;
  bottom: 22px;
  right: 22px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 80;
}
.toast {
  background: #1A1D21;
  color: white;
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-lg);
  min-width: 240px;
  animation: toastIn 0.2s ease;
}
.toast.success { background: #1A1D21; }
.toast .ic { color: var(--success); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 18, 22, 0.36);
  display: grid;
  place-items: center;
  z-index: 60;
  animation: fadeIn 0.12s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: min(620px, 92vw);
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal.lg { width: min(880px, 94vw); }
.modal-head {
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
}
.modal-title { font-size: 15px; font-weight: 600; }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* Misc */
.divider { height: 1px; background: var(--border); margin: 18px 0; }
.row { display: flex; gap: 10px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; }
.muted { color: var(--text-secondary); }
.faint { color: var(--text-tertiary); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.center { display: grid; place-items: center; }

.legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-secondary);
}
.legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: middle; }

/* Forms grids */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.form-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.full { grid-column: 1 / -1; }

/* Empty state */
.empty {
  padding: 38px 18px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 13px;
}

/* progress bar */
.progress {
  height: 6px;
  background: var(--bg-hover);
  border-radius: 4px;
  overflow: hidden;
  width: 100%;
}
.progress > span {
  display: block;
  height: 100%;
  background: var(--accent);
}

/* scrollbar */
.scroll-area::-webkit-scrollbar { width: 10px; height: 10px; }
.scroll-area::-webkit-scrollbar-thumb {
  background: #D5D9DE;
  border-radius: 10px;
  border: 2px solid var(--bg);
}
.scroll-area::-webkit-scrollbar-track { background: transparent; }

/* report */
.report-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
.report-tbl td, .report-tbl th { padding: 7px 14px; }
.report-tbl th { font-weight: 500; color: var(--text-secondary); font-size: 12px; border-bottom: 1px solid var(--border); text-align: right; }
.report-tbl th:first-child { text-align: left; }
.report-tbl td.label { padding-left: var(--ind, 14px); }
.report-tbl td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: 'IBM Plex Mono', monospace; }
.report-tbl tr.section td { font-weight: 600; background: var(--bg-subtle); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.report-tbl tr.total td { font-weight: 600; border-top: 1px solid var(--border-strong); }
.report-tbl tr.grand td { font-weight: 700; background: var(--accent-soft); border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent); }
.report-tbl tr.subtotal td { font-weight: 500; border-top: 1px solid var(--border); }
.report-tbl td.label.indent-1 { padding-left: 32px; }
.report-tbl td.label.indent-2 { padding-left: 52px; }

/* ===== Multi-Company / Segment additions ===== */
.co-chip {
  display: inline-block;
  margin-left: 10px;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 0.4px;
  vertical-align: middle;
}
.company-picker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 4px 0 10px;
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  border-radius: var(--radius);
  color: var(--text-secondary);
  height: 32px;
}
.company-picker .co-select {
  border: none;
  background: transparent;
  font-weight: 500;
  min-width: 240px;
  padding-right: 28px;
}
.company-picker .co-select:focus {
  outline: none;
}
.segment-tbl th, .segment-tbl td {
  white-space: nowrap;
}
.segment-tbl tfoot td {
  border-top: 2px solid var(--border-strong);
}

/* segment tag in tables */
.segment-tag {
  background: var(--accent-soft);
  color: var(--accent-text);
  font-weight: 500;
}
.entity-chip {
  display: inline-block;
  vertical-align: middle;
}

/* ===== Drill-down rows in report table ===== */
.report-tbl tr.drill-row {
  cursor: pointer;
  transition: background 0.1s;
}
.report-tbl tr.drill-row:hover td {
  background: var(--bg-hover);
}
.report-tbl tr.drill-row.drill-open td {
  background: var(--accent-soft);
  color: var(--text);
}
.drill-chevron {
  display: inline-flex;
  align-items: center;
  color: var(--text-tertiary);
  transition: transform 0.18s;
  flex-shrink: 0;
}
.drill-chevron.open {
  transform: rotate(90deg);
  color: var(--accent);
}
/* Segment header row inside drill-down */
.report-tbl tr.drill-seg-head td {
  background: var(--accent-soft-strong);
  padding: 5px 14px 5px 52px;
  font-size: 12px;
  border-top: 1px solid var(--accent-soft-strong);
}
/* Segment data rows */
.report-tbl tr.drill-seg-row td {
  background: var(--bg-subtle);
  font-size: 12.5px;
  border-bottom: 1px solid var(--border);
}
.report-tbl tr.drill-seg-row:last-of-type td {
  border-bottom: none;
}
/* Segment subtotal row */
.report-tbl tr.drill-seg-total td {
  background: var(--bg-muted);
  border-top: 1px solid var(--border);
  border-bottom: 2px solid var(--border-strong);
  font-size: 12.5px;
}
/* Mini % bar inside segment row */
.drill-pct-bar {
  display: inline-block;
  width: 60px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  vertical-align: middle;
  flex-shrink: 0;
}
.drill-pct-bar span {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s;
}

</style>
</head>
<body>
<div id="root"></div>

    exports, categories,
    // segment data
    incomeSegmentsByCo, expenseSegments, segmentMonths,

    getIncomeMatrix, getExpenseMatrix, getCompanyTotals,
    getEntityForAccount, getSegmentName,

  };
})();

window.fmtTHB = function (n, opts = {}) {
  if (n == null || isNaN(n)) return "—";
  const { compact = false, sign = false, decimals = 0 } = opts;
  const abs = Math.abs(n);
  let str;
  if (compact && abs >= 1_000_000) {
    str = (abs / 1_000_000).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " ลบ.";
  } else {
    str = abs.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  if (n < 0) return "(" + str + ")";
  return sign && n > 0 ? "+" + str : str;
};

window.fmtTHBShort = function (n) {
  if (n == null) return "—";
  const abs = Math.abs(n);
  let v, suf;
  if (abs >= 1_000_000_000) { v = n / 1_000_000_000; suf = " พันลบ."; }
  else if (abs >= 1_000_000) { v = n / 1_000_000; suf = " ลบ."; }
  else if (abs >= 1_000) { v = n / 1_000; suf = " พัน"; }
  else { v = n; suf = ""; }
  return v.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + suf;
};
