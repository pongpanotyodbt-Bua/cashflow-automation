<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CashFlow Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* Cash Flow Management — Minimal enterprise (Linear/Notion-inspired) */

:root {
  /* Neutral scale */
  --bg: #FFFFFF;
  --bg-subtle: #FAFBFC;
  --bg-muted: #F6F7F9;
  --bg-hover: #F1F2F4;
  --bg-active: #EAECEF;
  --sidebar-bg: #FAFBFC;

  /* Border */
  --border: #E6E8EB;
  --border-strong: #D5D9DE;

  /* Text */
  --text: #1A1D21;
  --text-secondary: #5C6470;
  --text-tertiary: #8B95A1;
  --text-on-accent: #FFFFFF;

  /* Accent (blue) */
  --accent: #2A6FF0;
  --accent-hover: #1F5BD8;
  --accent-soft: #EAF1FE;
  --accent-soft-strong: #D6E4FD;
  --accent-text: #1F5BD8;

  /* Semantic */
  --success: #1F9D55;
  --success-soft: #E6F5EC;
  --danger: #D03434;
  --danger-soft: #FBEAEA;
  --warning: #C97A00;
  --warning-soft: #FBF1DD;

  /* Layout */
  --sidebar-width: 248px;
  --topbar-h: 52px;
  --radius-sm: 4px;
  --radius: 6px;
  --radius-lg: 10px;

  /* Density */
  --row-h: 36px;
  --pad: 14px;
  --font-base: 13.5px;

  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
  --shadow: 0 4px 12px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.04);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.12), 0 2px 6px rgba(16, 24, 40, 0.06);
}

[data-density="compact"] {
  --row-h: 30px;
  --pad: 10px;
  --font-base: 12.5px;
}
[data-density="comfortable"] {
  --row-h: 42px;
  --pad: 18px;
  --font-base: 14.5px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: var(--font-base);
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button {
  font-family: inherit;
  font-size: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

.mono, .num {
  font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  font-variant-numeric: tabular-nums;
}

/* ---------- Layout ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  height: 100vh;
  overflow: hidden;
}
.app[data-sidebar="right"] {
  grid-template-columns: 1fr var(--sidebar-width);
}
.app[data-sidebar="right"] .sidebar {
  order: 2;
  border-right: none;
  border-left: 1px solid var(--border);
}

.sidebar {
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sb-brand {
  padding: 16px 18px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}
.sb-logo {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  background: var(--accent);
  display: grid;
  place-items: center;
  color: white;
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}
.sb-brand-name {
  font-weight: 600;
  font-size: 13.5px;
  line-height: 1.2;
}
.sb-brand-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 1px;
}

.sb-section {
  padding: 14px 10px 4px;
}
.sb-section-label {
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 4px 10px 8px;
  font-weight: 500;
}
.sb-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 10px;
  margin: 1px 0;
  border-radius: var(--radius);
  color: var(--text-secondary);
  font-size: 13px;
  width: 100%;
  text-align: left;
  cursor: pointer;
  user-select: none;
  transition: background 0.08s;
}
.sb-item:hover { background: var(--bg-hover); color: var(--text); }
.sb-item.active {
  background: var(--bg-active);
  color: var(--text);
  font-weight: 500;
}
.sb-item .ic { flex-shrink: 0; opacity: 0.85; }
.sb-item-badge {
  margin-left: auto;
  font-size: 11px;
  background: var(--bg-hover);
  color: var(--text-secondary);
  padding: 1px 6px;
  border-radius: 10px;
  font-variant-numeric: tabular-nums;
}
.sb-item.active .sb-item-badge {
  background: var(--bg);
  color: var(--text);
}

.sb-spacer { flex: 1; }
.sb-footer {
  padding: 10px 14px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-secondary);
}
.sb-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c7d4f0, #94a8c9);
  color: white;
  display: grid;
  place-items: center;
  font-weight: 600;
  font-size: 11px;
}

/* ---------- Main ---------- */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.topbar {
  height: var(--topbar-h);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 22px;
  gap: 14px;
  flex-shrink: 0;
  background: var(--bg);
}
.crumbs {
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.crumbs .sep { color: var(--text-tertiary); }
.crumbs .here { color: var(--text); font-weight: 500; }
.tb-spacer { flex: 1; }

.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}
.page {
  padding: 24px 28px 60px;
  max-width: 1480px;
  margin: 0 auto;
  width: 100%;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
}
.page-title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
}
.page-sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin: 0;
}
.page-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  font-size: 13px;
  border-radius: var(--radius);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  color: var(--text);
  font-weight: 500;
  transition: background 0.08s, border 0.08s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-hover); }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--text-on-accent);
}
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost {
  background: transparent;
  border-color: transparent;
}
.btn.ghost:hover { background: var(--bg-hover); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger-soft); }
.btn .ic { opacity: 0.7; }
.btn.primary .ic { opacity: 1; }

.iconbtn {
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  color: var(--text-secondary);
  border: 1px solid transparent;
}
.iconbtn:hover { background: var(--bg-hover); color: var(--text); }

/* ---------- Input ---------- */
.input, .select {
  display: inline-flex;
  align-items: center;
  height: 30px;
  padding: 0 10px;
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  font-size: 13px;
  outline: none;
  min-width: 0;
  color: var(--text);
}
.input:focus, .select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input.search { padding-left: 30px; }
.search-wrap { position: relative; display: inline-flex; align-items: center; }
.search-wrap .search-ic { position: absolute; left: 9px; color: var(--text-tertiary); pointer-events: none; }

label.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
  color: var(--text-secondary);
}
label.field .input,
label.field .select,
label.field textarea {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
label.field textarea {
  min-height: 70px;
  padding: 8px 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--bg);
  font-family: inherit;
  resize: vertical;
}

/* ---------- Card ---------- */
.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.card-pad { padding: var(--pad); }
.card-head {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-title {
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
}
.card-sub {
  font-size: 12px;
  color: var(--text-secondary);
}

/* ---------- KPI cards ---------- */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.kpi {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.kpi-label {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.kpi-value {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.kpi-delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-secondary);
}
.kpi-delta .up { color: var(--success); font-weight: 500; }
.kpi-delta .down { color: var(--danger); font-weight: 500; }

/* ---------- Table ---------- */
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.tbl th {
  text-align: left;
  font-weight: 500;
  font-size: 12px;
  color: var(--text-secondary);
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-subtle);
  white-space: nowrap;
}
.tbl td {
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  height: var(--row-h);
  vertical-align: middle;
}
.tbl tbody tr:hover { background: var(--bg-subtle); }
.tbl .num {
  text-align: right;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}
.tbl th.num { text-align: right; }
.tbl.dense td { height: 30px; }

/* tag / badge / chip */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 11.5px;
  font-weight: 500;
  background: var(--bg-hover);
  color: var(--text-secondary);
  white-space: nowrap;
}
.tag.success { background: var(--success-soft); color: var(--success); }
.tag.danger { background: var(--danger-soft); color: var(--danger); }
.tag.warning { background: var(--warning-soft); color: var(--warning); }
.tag.accent { background: var(--accent-soft); color: var(--accent-text); }
.tag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.pos { color: var(--success); }
.neg { color: var(--danger); }

/* Tabs */
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
}
.tab {
  padding: 8px 14px;
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }

/* Segmented */
.segmented {
  display: inline-flex;
  background: var(--bg-muted);
  border-radius: var(--radius);
  padding: 2px;
  gap: 2px;
}
.segmented button {
  height: 26px;
  padding: 0 10px;
  font-size: 12.5px;
  color: var(--text-secondary);
  border-radius: 4px;
  font-weight: 500;
}
.segmented button:hover { color: var(--text); }
.segmented button.active {
  background: var(--bg);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

/* Toast */
.toast-host {
  position: fixed;
  bottom: 22px;
  right: 22px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 80;
}
.toast {
  background: #1A1D21;
  color: white;
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-lg);
  min-width: 240px;
  animation: toastIn 0.2s ease;
}
.toast.success { background: #1A1D21; }
.toast .ic { color: var(--success); }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 18, 22, 0.36);
  display: grid;
  place-items: center;
  z-index: 60;
  animation: fadeIn 0.12s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: min(620px, 92vw);
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal.lg { width: min(880px, 94vw); }
.modal-head {
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
}
.modal-title { font-size: 15px; font-weight: 600; }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* Misc */
.divider { height: 1px; background: var(--border); margin: 18px 0; }
.row { display: flex; gap: 10px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; }
.muted { color: var(--text-secondary); }
.faint { color: var(--text-tertiary); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.center { display: grid; place-items: center; }

.legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-secondary);
}
.legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: middle; }

/* Forms grids */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.form-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.full { grid-column: 1 / -1; }

/* Empty state */
.empty {
  padding: 38px 18px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 13px;
}

/* progress bar */
.progress {
  height: 6px;
  background: var(--bg-hover);
  border-radius: 4px;
  overflow: hidden;
  width: 100%;
}
.progress > span {
  display: block;
  height: 100%;
  background: var(--accent);
}

/* scrollbar */
.scroll-area::-webkit-scrollbar { width: 10px; height: 10px; }
.scroll-area::-webkit-scrollbar-thumb {
  background: #D5D9DE;
  border-radius: 10px;
  border: 2px solid var(--bg);
}
.scroll-area::-webkit-scrollbar-track { background: transparent; }

/* report */
.report-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
.report-tbl td, .report-tbl th { padding: 7px 14px; }
.report-tbl th { font-weight: 500; color: var(--text-secondary); font-size: 12px; border-bottom: 1px solid var(--border); text-align: right; }
.report-tbl th:first-child { text-align: left; }
.report-tbl td.label { padding-left: var(--ind, 14px); }
.report-tbl td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: 'IBM Plex Mono', monospace; }
.report-tbl tr.section td { font-weight: 600; background: var(--bg-subtle); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.report-tbl tr.total td { font-weight: 600; border-top: 1px solid var(--border-strong); }
.report-tbl tr.grand td { font-weight: 700; background: var(--accent-soft); border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent); }
.report-tbl tr.subtotal td { font-weight: 500; border-top: 1px solid var(--border); }
.report-tbl td.label.indent-1 { padding-left: 32px; }
.report-tbl td.label.indent-2 { padding-left: 52px; }

/* ===== Multi-Company / Segment additions ===== */
.co-chip {
  display: inline-block;
  margin-left: 10px;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 0.4px;
  vertical-align: middle;
}
.company-picker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 4px 0 10px;
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  border-radius: var(--radius);
  color: var(--text-secondary);
  height: 32px;
}
.company-picker .co-select {
  border: none;
  background: transparent;
  font-weight: 500;
  min-width: 240px;
  padding-right: 28px;
}
.company-picker .co-select:focus {
  outline: none;
}
.segment-tbl th, .segment-tbl td {
  white-space: nowrap;
}
.segment-tbl tfoot td {
  border-top: 2px solid var(--border-strong);
}

/* segment tag in tables */
.segment-tag {
  background: var(--accent-soft);
  color: var(--accent-text);
  font-weight: 500;
}
.entity-chip {
  display: inline-block;
  vertical-align: middle;
}

/* ===== Drill-down rows in report table ===== */
.report-tbl tr.drill-row {
  cursor: pointer;
  transition: background 0.1s;
}
.report-tbl tr.drill-row:hover td {
  background: var(--bg-hover);
}
.report-tbl tr.drill-row.drill-open td {
  background: var(--accent-soft);
  color: var(--text);
}
.drill-chevron {
  display: inline-flex;
  align-items: center;
  color: var(--text-tertiary);
  transition: transform 0.18s;
  flex-shrink: 0;
}
.drill-chevron.open {
  transform: rotate(90deg);
  color: var(--accent);
}
/* Segment header row inside drill-down */
.report-tbl tr.drill-seg-head td {
  background: var(--accent-soft-strong);
  padding: 5px 14px 5px 52px;
  font-size: 12px;
  border-top: 1px solid var(--accent-soft-strong);
}
/* Segment data rows */
.report-tbl tr.drill-seg-row td {
  background: var(--bg-subtle);
  font-size: 12.5px;
  border-bottom: 1px solid var(--border);
}
.report-tbl tr.drill-seg-row:last-of-type td {
  border-bottom: none;
}
/* Segment subtotal row */
.report-tbl tr.drill-seg-total td {
  background: var(--bg-muted);
  border-top: 1px solid var(--border);
  border-bottom: 2px solid var(--border-strong);
  font-size: 12.5px;
}
/* Mini % bar inside segment row */
.drill-pct-bar {
  display: inline-block;
  width: 60px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  vertical-align: middle;
  flex-shrink: 0;
}
.drill-pct-bar span {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s;
}

</style>
</head>
<body>
<div id="root"></div>

    topInflowCats, topOutflowCats, recentTxns,
    arAging, apAging, glAccounts, inventory,
    forecast, reconItems, directCF, indirectCF,
    exports, categories,
    // segment data
    incomeSegmentsByCo, expenseSegments, segmentMonths,
    incomeByCoMonth, expenseByCoMonth,
    getIncomeMatrix, getExpenseMatrix, getCompanyTotals,
    getEntityForAccount, getSegmentName,
    cfMapping, filterSegmentsByMapping,
    totals: { totalCash, inflowQ1, outflowQ1, netQ1: inflowQ1 - outflowQ1 },
  };
})();

window.fmtTHB = function (n, opts = {}) {
  if (n == null || isNaN(n)) return "—";
  const { compact = false, sign = false, decimals = 0 } = opts;
  const abs = Math.abs(n);
  let str;
  if (compact && abs >= 1_000_000) {
    str = (abs / 1_000_000).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " ลบ.";
  } else {
    str = abs.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  if (n < 0) return "(" + str + ")";
  return sign && n > 0 ? "+" + str : str;
};

window.fmtTHBShort = function (n) {
  if (n == null) return "—";
  const abs = Math.abs(n);
  let v, suf;
  if (abs >= 1_000_000_000) { v = n / 1_000_000_000; suf = " พันลบ."; }
  else if (abs >= 1_000_000) { v = n / 1_000_000; suf = " ลบ."; }
  else if (abs >= 1_000) { v = n / 1_000; suf = " พัน"; }
  else { v = n; suf = ""; }
  return v.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + suf;
};

<script type="text/babel">
/* Chart components — pure SVG, no library */

function useSize(ref) {
  const [size, setSize] = React.useState({ w: 600, h: 240 });
  React.useEffect(() => {
    if (!ref.current) return;
    const obs = new ResizeObserver(() => {
      if (ref.current) setSize({ w: ref.current.clientWidth, h: ref.current.clientHeight });
    });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return size;
}

/* TrendChart: line/bar/area for monthly inflow vs outflow */
function TrendChart({ data, height = 260, style = "line" }) {
  const ref = React.useRef(null);
  const { w } = useSize(ref);
  const padL = 56, padR = 16, padT = 12, padB = 28;
  const innerW = Math.max(0, w - padL - padR);
  const innerH = height - padT - padB;

  const maxVal = Math.max(...data.flatMap((d) => [d.inflow, d.outflow])) * 1.1;
  const n = data.length;
  const stepX = n > 1 ? innerW / (n - 1) : innerW;
  const barW = n > 0 ? (innerW / n) * 0.32 : 0;

  const yTicks = 4;
  const ticks = Array.from({ length: yTicks + 1 }, (_, i) => (maxVal / yTicks) * i);

  const xFor = (i) => padL + i * stepX;
  const xForBar = (i, j) => padL + i * stepX - barW + (j === 0 ? 0 : barW);
  const yFor = (v) => padT + innerH - (v / maxVal) * innerH;

  const linePath = (key) =>
    data.map((d, i) => `${i === 0 ? "M" : "L"} ${xFor(i)} ${yFor(d[key])}`).join(" ");

  const areaPath = (key) =>
    `M ${padL} ${padT + innerH} ` +
    data.map((d, i) => `L ${xFor(i)} ${yFor(d[key])}`).join(" ") +
    ` L ${padL + (n - 1) * stepX} ${padT + innerH} Z`;

  return (
    <div ref={ref} style={{ width: "100%", height }}>
      <svg width="100%" height={height} style={{ overflow: "visible" }}>
        <defs>
          <linearGradient id="gIn" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#1F9D55" stopOpacity="0.22" />
            <stop offset="100%" stopColor="#1F9D55" stopOpacity="0" />
          </linearGradient>
          <linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#D03434" stopOpacity="0.18" />
            <stop offset="100%" stopColor="#D03434" stopOpacity="0" />
          </linearGradient>
        </defs>

        {/* gridlines */}
        {ticks.map((t, i) => (
          <g key={i}>
            <line x1={padL} x2={w - padR} y1={yFor(t)} y2={yFor(t)} stroke="#EEF0F3" strokeWidth="1" />
            <text x={padL - 8} y={yFor(t) + 3} fontSize="10.5" textAnchor="end" fill="#8B95A1" fontFamily="IBM Plex Mono, monospace">{(t / 1_000_000).toFixed(0)}M</text>
          </g>
        ))}

        {/* X labels */}
        {data.map((d, i) => (
          <text key={i} x={xFor(i)} y={height - 10} fontSize="10.5" textAnchor="middle" fill="#5C6470">{d.m || d.label || d.date?.slice(5)}</text>
        ))}

        {style === "bar" && data.map((d, i) => (
          <g key={i}>
            <rect x={xFor(i) - barW - 1} y={yFor(d.inflow)} width={barW} height={innerH - (yFor(d.inflow) - padT)} fill="#1F9D55" rx="2" />
            <rect x={xFor(i) + 1} y={yFor(d.outflow)} width={barW} height={innerH - (yFor(d.outflow) - padT)} fill="#D03434" rx="2" />
          </g>
        ))}

        {style === "area" && (
          <>
            <path d={areaPath("inflow")} fill="url(#gIn)" />
            <path d={areaPath("outflow")} fill="url(#gOut)" />
            <path d={linePath("inflow")} fill="none" stroke="#1F9D55" strokeWidth="2" />
            <path d={linePath("outflow")} fill="none" stroke="#D03434" strokeWidth="2" />
          </>
        )}

        {style === "line" && (
          <>
            <path d={linePath("inflow")} fill="none" stroke="#1F9D55" strokeWidth="2" />
            <path d={linePath("outflow")} fill="none" stroke="#D03434" strokeWidth="2" />
            {data.map((d, i) => (
              <g key={i}>
                <circle cx={xFor(i)} cy={yFor(d.inflow)} r="3" fill="white" stroke="#1F9D55" strokeWidth="1.8" />
                <circle cx={xFor(i)} cy={yFor(d.outflow)} r="3" fill="white" stroke="#D03434" strokeWidth="1.8" />
              </g>
            ))}
          </>
        )}
      </svg>
    </div>
  );
}

/* Mini sparkline */
function Sparkline({ data, color = "#2A6FF0", height = 38, fill = false }) {
  const ref = React.useRef(null);
  const { w } = useSize(ref);
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const stepX = data.length > 1 ? w / (data.length - 1) : w;
  const path = data.map((v, i) => `${i === 0 ? "M" : "L"} ${i * stepX} ${height - 2 - ((v - min) / range) * (height - 6)}`).join(" ");
  const area = path + ` L ${(data.length - 1) * stepX} ${height} L 0 ${height} Z`;
  return (
    <div ref={ref} style={{ width: "100%", height }}>
      <svg width="100%" height={height}>
        {fill && <path d={area} fill={color} fillOpacity="0.12" />}
        <path d={path} fill="none" stroke={color} strokeWidth="1.6" />
      </svg>
    </div>
  );
}

/* Bar list — horizontal mini bars next to category names */
function BarList({ items, color = "#2A6FF0", showSign = false }) {
  const max = Math.max(...items.map((i) => i.amt));
  return (
    <div className="col" style={{ gap: 10 }}>
      {items.map((it) => (
        <div key={it.cat}>
          <div className="row" style={{ justifyContent: "space-between", marginBottom: 4 }}>
            <div className="small" style={{ color: "var(--text)" }}>{it.cat}</div>
            <div className="small num">{showSign ? "−" : ""}{window.fmtTHB(it.amt, { compact: true })}</div>
          </div>
          <div style={{ height: 6, background: "var(--bg-hover)", borderRadius: 3, overflow: "hidden" }}>
            <div style={{ width: `${(it.amt / max) * 100}%`, height: "100%", background: color, borderRadius: 3 }} />
          </div>
        </div>
      ))}
    </div>
  );
}

/* Donut: list of items with amt */
function Donut({ items, total, size = 140, thickness = 22 }) {
  const r = size / 2 - thickness / 2;
  const cx = size / 2, cy = size / 2;
  const C = 2 * Math.PI * r;
  let acc = 0;
  const palette = ["#2A6FF0", "#1F9D55", "#7C4DFF", "#C97A00", "#D03434", "#0E97A0"];
  return (
    <div className="row" style={{ gap: 18, alignItems: "center" }}>
      <svg width={size} height={size}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#EEF0F3" strokeWidth={thickness} />
        {items.map((it, i) => {
          const frac = it.amt / total;
          const dash = frac * C;
          const off = -acc * C;
          acc += frac;
          return (
            <circle key={i} cx={cx} cy={cy} r={r}
              fill="none"
              stroke={palette[i % palette.length]}
              strokeWidth={thickness}
              strokeDasharray={`${dash} ${C - dash}`}
              strokeDashoffset={off}
              transform={`rotate(-90 ${cx} ${cy})`}
            />
          );
        })}
        <text x={cx} y={cy - 2} textAnchor="middle" fontSize="11" fill="#8B95A1">รวม</text>
        <text x={cx} y={cy + 14} textAnchor="middle" fontSize="14" fontWeight="600" fontFamily="IBM Plex Mono, monospace" fill="#1A1D21">{window.fmtTHBShort(total)}</text>
      </svg>
      <div className="col" style={{ gap: 6, flex: 1 }}>
        {items.map((it, i) => (
          <div key={i} className="row" style={{ justifyContent: "space-between", fontSize: 12 }}>
            <div className="row" style={{ gap: 6 }}>
              <span className="sw" style={{ background: palette[i % palette.length], width: 9, height: 9, borderRadius: 2 }} />
              <span>{it.cat}</span>
            </div>
            <span className="num muted">{(it.pct * 100).toFixed(1)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* StackedBarChart: stacked bars per month, one segment per stack */
function StackedBarChart({ months, segments, data, height = 280, palette }) {
  const ref = React.useRef(null);
  const { w } = useSize(ref);
  const padL = 56, padR = 16, padT = 14, padB = 28;
  const innerW = Math.max(0, w - padL - padR);
  const innerH = height - padT - padB;
  const defaultPalette = ["#2A6FF0", "#1F9D55", "#7C4DFF", "#C97A00", "#D03434", "#0E97A0", "#8B5A2B", "#8B95A1", "#E15A8A", "#3D8B40"];

  const colorFor = (seg, i) => seg.color || (palette && palette[i % palette.length]) || defaultPalette[i % defaultPalette.length];

  // Totals per month for max value
  const totals = months.map((_, i) => segments.reduce((s, sg) => s + (data[sg.id]?.[i] || 0), 0));
  const maxVal = (Math.max(...totals, 1)) * 1.12;
  const n = months.length;
  const slotW = innerW / n;
  const barW = slotW * 0.62;
  const yTicks = 4;
  const ticks = Array.from({ length: yTicks + 1 }, (_, i) => (maxVal / yTicks) * i);
  const yFor = (v) => padT + innerH - (v / maxVal) * innerH;
  const xFor = (i) => padL + i * slotW + slotW / 2;

  return (
    <div ref={ref} style={{ width: "100%", height }}>
      <svg width="100%" height={height} style={{ overflow: "visible" }}>
        {ticks.map((t, i) => (
          <g key={i}>
            <line x1={padL} x2={w - padR} y1={yFor(t)} y2={yFor(t)} stroke="#EEF0F3" strokeWidth="1" />
            <text x={padL - 8} y={yFor(t) + 3} fontSize="10.5" textAnchor="end" fill="#8B95A1" fontFamily="IBM Plex Mono, monospace">
              {(t / 1_000_000).toFixed(0)}M
            </text>
          </g>
        ))}

        {months.map((m, i) => {
          let yCursor = padT + innerH;
          return (
            <g key={i}>
              {segments.map((sg, sIdx) => {
                const v = data[sg.id]?.[i] || 0;
                if (v <= 0) return null;
                const h = (v / maxVal) * innerH;
                yCursor -= h;
                return (
                  <rect key={sg.id}
                        x={xFor(i) - barW / 2}
                        y={yCursor}
                        width={barW}
                        height={h}
                        fill={colorFor(sg, sIdx)}
                        opacity={0.92}>
                    <title>{sg.name}: {window.fmtTHB(v)}</title>
                  </rect>
                );
              })}
              <text x={xFor(i)} y={height - 10} fontSize="10.5" textAnchor="middle" fill="#5C6470">{m}</text>
              <text x={xFor(i)} y={yFor(totals[i]) - 5} fontSize="10" textAnchor="middle" fill="#5C6470" fontFamily="IBM Plex Mono, monospace">
                {window.fmtTHBShort(totals[i])}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

/* SegmentTable: months × segments with row/col totals */
function SegmentTable({ months, segments, data, palette, valueColor = "var(--text)" }) {
  const defaultPalette = ["#2A6FF0", "#1F9D55", "#7C4DFF", "#C97A00", "#D03434", "#0E97A0", "#8B5A2B", "#8B95A1", "#E15A8A", "#3D8B40"];
  const colorFor = (seg, i) => seg.color || (palette && palette[i % palette.length]) || defaultPalette[i % defaultPalette.length];
  const rowTotal = (sg) => (data[sg.id] || []).reduce((s, v) => s + v, 0);
  const colTotal = (i) => segments.reduce((s, sg) => s + (data[sg.id]?.[i] || 0), 0);
  const grand = segments.reduce((s, sg) => s + rowTotal(sg), 0);
  return (
    <div style={{ overflowX: "auto" }}>
      <table className="tbl segment-tbl">
        <thead>
          <tr>
            <th style={{ minWidth: 200 }}>Segment</th>
            {months.map(m => <th key={m} className="num" style={{ minWidth: 90 }}>{m}</th>)}
            <th className="num" style={{ minWidth: 110, background: "var(--bg-subtle)" }}>รวม</th>
            <th className="num" style={{ width: 60 }}>%</th>
          </tr>
        </thead>
        <tbody>
          {segments.map((sg, i) => {
            const tot = rowTotal(sg);
            const pct = grand > 0 ? (tot / grand) * 100 : 0;
            return (
              <tr key={sg.id}>

  const cfMapping = {

  // Filter income/expense segments by the mapping for a given line label
  function filterSegmentsByMapping(segments, label, companyId) {
    const m = cfMapping[label];
    if (!m) return segments;
    if (m.type === "expense") {
      return segments.filter(s => (m.expenseSegments || []).includes(s.id));
    }
    if (m.type === "income") {
      const inc = m.incomeSegments || {};
      if (companyId && companyId !== "CONSO") {
        const allowed = inc[companyId] || [];
        return segments.filter(s => allowed.includes(s.id));
      }
      const allCombos = [];
      Object.entries(inc).forEach(([entity, segs]) => {
        (segs || []).forEach(sid => allCombos.push(`${entity}:${sid}`));
      });
      return segments.filter(s => allCombos.includes(s.id));
    }
    return segments;
  }

      return s ? `${s.id} – ${s.name}` : segmentId;
    }
    const list = incomeSegmentsByCo[entity] || [];
    const s = list.find(x => x.id === segmentId);
    return s ? s.name : segmentId;
  }

window.fmtTHB = function (n, opts = {}) {
  if (n == null || isNaN(n)) return "—";
  const { compact = false, sign = false, decimals = 0 } = opts;
  const abs = Math.abs(n);
  let str;
  if (compact && abs >= 1_000_000) {
    str = (abs / 1_000_000).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " ลบ.";
  } else {
    str = abs.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  if (n < 0) return "(" + str + ")";
  return sign && n > 0 ? "+" + str : str;
};

window.fmtTHBShort = function (n) {
  if (n == null) return "—";
  const abs = Math.abs(n);
  let v, suf;
  if (abs >= 1_000_000_000) { v = n / 1_000_000_000; suf = " พันลบ."; }
  else if (abs >= 1_000_000) { v = n / 1_000_000; suf = " ลบ."; }
  else if (abs >= 1_000) { v = n / 1_000; suf = " พัน"; }
  else { v = n; suf = ""; }
  return v.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + suf;
};

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel">

  const inflowQ1 = coTotals.inflowQ1;
  const outflowQ1 = coTotals.outflowQ1;
  const netQ1 = coTotals.netQ1;

  const trendData = view === "monthly"
    ? coMonthly
    : d.trend30.slice(-14).map((x) => ({ ...x, m: x.date.slice(5) }));

  return (
    <>
      <div className="page-head">

function UploadModal({ onClose, onDone }) {
  const [step, setStep] = React.useState(1);
  const [progress, setProgress] = React.useState(0);
  React.useEffect(() => {
    if (step !== 2) return;
    const t = setInterval(() => {
      setProgress((p) => {
        if (p >= 100) { clearInterval(t); setTimeout(() => setStep(3), 300); return 100; }
        return p + 8;
      });
    }, 90);
    return () => clearInterval(t);
  }, [step]);

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal lg" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">นำเข้า Bank Statement</div>
          <span className="tag" style={{ marginLeft: 10 }}>ขั้นตอนที่ {step} / 3</span>
          <button className="iconbtn" style={{ marginLeft: "auto" }} onClick={onClose}><Ic name="x" size={16} /></button>
        </div>
        <div className="modal-body">
          {step === 1 && (
            <>
              <div className="form-grid">
                <label className="field">ธนาคาร / บัญชี
                  <select className="select">
                    {window.CFData.bankAccounts.map((b) => <option key={b.id}>{b.bank} — {b.id}</option>)}
                  </select>
                </label>
                <label className="field">รูปแบบไฟล์
                  <select className="select"><option>Excel (.xlsx)</option><option>CSV</option><option>PDF Bank Statement</option><option>MT940</option></select>
                </label>
              </div>
              <div style={{ marginTop: 14, border: "1.5px dashed var(--border-strong)", borderRadius: 10, padding: 38, textAlign: "center", background: "var(--bg-subtle)" }}>
                <Ic name="upload" size={24} style={{ color: "var(--text-tertiary)" }} />
                <div style={{ marginTop: 8, fontWeight: 500 }}>ลากไฟล์มาวาง หรือ คลิกเลือกไฟล์</div>
                <div className="small muted" style={{ marginTop: 4 }}>รองรับ .xlsx, .csv, .pdf, .txt — ขนาดไม่เกิน 25 MB</div>
                <button className="btn primary" style={{ marginTop: 14 }}>เลือกไฟล์</button>
              </div>
              <div className="small muted" style={{ marginTop: 12 }}>
                <strong>คำแนะนำ:</strong> ไฟล์ต้องประกอบด้วยคอลัมน์ <code>วันที่</code>, <code>รายละเอียด</code>, <code>เดบิต/เครดิต</code>, <code>ยอดคงเหลือ</code>
              </div>
            </>
          )}
          {step === 2 && (
            <div style={{ padding: "20px 4px" }}>
              <div style={{ fontWeight: 500 }}>กำลังประมวลผลไฟล์...</div>
              <div className="small muted" style={{ marginBottom: 14 }}>statement_BA001_032026.xlsx — 184 รายการ</div>
              <div className="progress"><span style={{ width: progress + "%" }} /></div>
              <div className="row" style={{ justifyContent: "space-between", marginTop: 8 }} >
                <span className="small muted">กำลังจับคู่กับ GL ...</span>
                <span className="small num">{progress}%</span>
              </div>
            </div>
          )}
          {step === 3 && (
            <div style={{ textAlign: "center", padding: "10px 0" }}>
              <div style={{ width: 56, height: 56, borderRadius: "50%", background: "var(--success-soft)", color: "var(--success)", display: "inline-grid", placeItems: "center", marginBottom: 12 }}>
                <Ic name="check" size={26} />
              </div>
              <div style={{ fontSize: 16, fontWeight: 600 }}>นำเข้าสำเร็จ</div>
              <div className="muted" style={{ marginTop: 4 }}>184 รายการ — Matched 172 / Pending 9 / Review 3</div>
              <div className="row" style={{ justifyContent: "center", gap: 16, marginTop: 20 }}>
                <Stat label="Matched" value="172" color="var(--success)" />
                <Stat label="Pending" value="9" color="var(--warning)" />
                <Stat label="Review" value="3" color="var(--danger)" />
              </div>
            </div>
          )}
        </div>
        <div className="modal-foot">
          {step === 1 && <>
            <button className="btn" onClick={onClose}>ยกเลิก</button>
            <button className="btn primary" onClick={() => setStep(2)}>ประมวลผล</button>
          </>}
          {step === 3 && <button className="btn primary" onClick={onDone}>เสร็จสิ้น</button>}

    </div>

function ForecastChart({ data, height = 260, style = "line" }) {
  const ref = React.useRef(null);
  const { w } = window.useSize(ref);
  const padL = 70, padR = 70, padT = 18, padB = 28;
  const innerW = Math.max(0, w - padL - padR);
  const innerH = height - padT - padB;
  const maxFlow = Math.max(...data.flatMap((d) => [d.inflow, d.outflow])) * 1.15;
  const balVals = data.map((x) => x.balance);
  const minBal = Math.min(...balVals) * 0.95, maxBal = Math.max(...balVals) * 1.05;
  const n = data.length;
  const stepX = innerW / (n - 1);
  const barW = (innerW / n) * 0.28;
  const yFlow = (v) => padT + innerH - (v / maxFlow) * innerH;
  const yBal = (v) => padT + innerH - ((v - minBal) / (maxBal - minBal)) * innerH;
  const xFor = (i) => padL + i * stepX;
  const balPath = data.map((d, i) => `${i === 0 ? "M" : "L"} ${xFor(i)} ${yBal(d.balance)}`).join(" ");
  return (
    <div ref={ref} style={{ width: "100%", height }}>
      <svg width="100%" height={height} style={{ overflow: "visible" }}>
        {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
          <line key={i} x1={padL} x2={w - padR} y1={padT + innerH * t} y2={padT + innerH * t} stroke="#EEF0F3" />
        ))}
        {data.map((d, i) => (
          <g key={i}>
            <rect x={xFor(i) - barW - 1} y={yFlow(d.inflow)} width={barW} height={innerH - (yFlow(d.inflow) - padT)} fill="#1F9D55" opacity="0.85" rx="2" />
            <rect x={xFor(i) + 1} y={yFlow(d.outflow)} width={barW} height={innerH - (yFlow(d.outflow) - padT)} fill="#D03434" opacity="0.85" rx="2" />
            <text x={xFor(i)} y={height - 10} fontSize="10.5" textAnchor="middle" fill="#5C6470">{d.week}</text>
          </g>
        ))}
        <path d={balPath} fill="none" stroke="#2A6FF0" strokeWidth="2.4" />
        {data.map((d, i) => (
          <circle key={i} cx={xFor(i)} cy={yBal(d.balance)} r="3.5" fill="white" stroke="#2A6FF0" strokeWidth="2" />
        ))}
        {/* Y axis labels - flow */}
        {[0, 0.5, 1].map((t, i) => (
          <text key={i} x={padL - 8} y={padT + innerH * (1 - t) + 4} fontSize="10.5" textAnchor="end" fill="#8B95A1" fontFamily="IBM Plex Mono, monospace">
            {window.fmtTHBShort(maxFlow * t)}
          </text>
        ))}
        {/* Y axis labels - balance (right) */}
        {[0, 0.5, 1].map((t, i) => (
          <text key={i} x={w - padR + 8} y={padT + innerH * (1 - t) + 4} fontSize="10.5" textAnchor="start" fill="#2A6FF0" fontFamily="IBM Plex Mono, monospace">
            {window.fmtTHBShort(minBal + (maxBal - minBal) * t)}
          </text>
        ))}
      </svg>
    </div>
  );
}

    { id: "MAP-2026-003", name: "CF_Mapping_Q1_2026_v3.xlsx", by: "K. ปริญญา ส.", at: "2026-03-28 14:32", rows: 32, status: "active" },
    { id: "MAP-2026-002", name: "CF_Mapping_Q1_2026_v2.xlsx", by: "K. ปริญญา ส.", at: "2026-02-15 10:18", rows: 28, status: "archived" },
    { id: "MAP-2026-001", name: "CF_Mapping_Initial.xlsx",   by: "K. รดา ม.",     at: "2026-01-08 09:45", rows: 24, status: "archived" },
  ]);

  React.useEffect(() => { d.cfMapping = mapping; }, [mapping]);

  const activityFor = (label) => {
    if (["ซื้อที่ดิน อาคารและอุปกรณ์","ขายสินทรัพย์ถาวร","เงินลงทุนระยะสั้น (เพิ่ม)/ลด","เงินปันผลรับจากเงินลงทุน"].includes(label)) return "Investing";
    if (["เงินกู้ระยะสั้นเพิ่มขึ้น/(ลดลง)","เงินกู้ระยะยาว – รับ","เงินกู้ระยะยาว – ชำระคืน","จ่ายเงินปันผล"].includes(label)) return "Financing";
    return "Operating";
  };
  const actColor = (a) => a === "Operating" ? "#2A6FF0" : a === "Investing" ? "#C97A00" : "#7C4DFF";

  // Count segments per CF line
  const segCountFor = (label, m) => {
    if (!m) return 0;
    if (m.type === "expense") return (m.expenseSegments || []).length;
    return Object.values(m.incomeSegments || {}).reduce((s, arr) => s + arr.length, 0);
  };

  // Status: complete / partial / empty
  const statusFor = (label, m) => {
    const n = segCountFor(label, m);
    if (n === 0) return "empty";
    return "complete";
  };
  const statusBadge = (s) => {
    if (s === "complete") return <span className="tag success" style={{ fontSize: 11 }}><Ic name="check" size={10} /> ครบ</span>;

    return <span className="tag danger" style={{ fontSize: 11 }}>ยังไม่มี</span>;
  };

  // Build CF lines list
  const cfLines = Object.entries(mapping).map(([label, m]) => ({
    label,
    m,
    activity: activityFor(label),
    segCount: segCountFor(label, m),
    status: statusFor(label, m),
  }));

  const filtered = filterAct === "all" ? cfLines : cfLines.filter(x => x.activity === filterAct);
  const countComplete = cfLines.filter(x => x.status === "complete").length;

  const totalSegs     = cfLines.reduce((s, x) => s + x.segCount, 0);

  // Get chip text for segments
  const segChips = (label, m) => {
    if (!m) return [];
    if (m.type === "expense") {
      return (m.expenseSegments || []).map(sid => {
        const ex = d.expenseSegments.find(x => x.id === sid);
        return { id: sid, name: ex ? sid + " " + ex.name : sid, color: ex?.color || "#888" };
      });
    }
    const chips = [];
    Object.entries(m.incomeSegments || {}).forEach(([entity, segs]) => {
      (segs || []).forEach(sid => chips.push({ id: entity + ":" + sid, name: d.getSegmentName(entity, sid, "in"), color: d.companies.find(c => c.id === entity)?.color || "#888" }));
    });
    return chips;
  };

    if (newMapping) setMapping(newMapping);
    const id = "MAP-2026-" + String(history.length + 4).padStart(3, "0");
    setHistory(h => [

    <>

      <div className="kpi-grid" style={{ gridTemplateColumns: "repeat(4, 1fr)", marginBottom: 14 }}>
        <MiniStat label="CF Lines ทั้งหมด" value={cfLines.length} raw />
        <MiniStat label="ครบแล้ว" value={countComplete} raw color="var(--success)" />
        <MiniStat label="ยังไม่มี Segment" value={countEmpty} raw color={countEmpty > 0 ? "var(--danger)" : "var(--text-tertiary)"} />
        <MiniStat label="Segments รวม" value={totalSegs} raw accent />
      </div>

      {/* ── Actions bar ── */}
      <div className="row" style={{ marginBottom: 14, gap: 8 }}>
        <div className="segmented">
          {["all","Operating","Investing","Financing"].map(a => (
            <button key={a} className={filterAct === a ? "active" : ""} onClick={() => setFilterAct(a)}>
              {a === "all" ? "ทั้งหมด" : a}
            </button>
          ))}
        </div>
        <div className="grow" />
        <button className="btn sm" onClick={() => toast && toast("ดาวน์โหลด CF_Mapping_Template.xlsx")}><Ic name="download" size={13} /> Template</button>
        <button className="btn sm primary" onClick={() => setShowUpload(true)}><Ic name="upload" size={13} /> อัปโหลด Mapping</button>
      </div>

      {/* ── CF Lines Cards ── */}
      <div className="card" style={{ marginBottom: 14 }}>
        <div className="card-head">
          <div className="card-title">CF Lines — Mapping ปัจจุบัน</div>
          <div className="grow" />
          <div className="legend" style={{ marginRight: 4 }}>
            <span><span className="sw" style={{ background: "#2A6FF0" }} />Operating</span>

          </div>
        </div>

        <div style={{ padding: "4px 0 8px" }}>
          {filtered.map(({ label, m, activity, segCount, status }) => {
            const chips = segChips(label, m);

            return (
              <div key={label} style={{

                transition: "background 0.1s",

                onMouseEnter={e => e.currentTarget.style.background = "var(--bg-hover)"}

              >

/* ----- Quick Edit Modal for a single CF Line ----- */
function CFLineEditModal({ label, mapping, setMapping, onClose, toast }) {
  const d = window.CFData;
  const m = mapping[label] || { type: "expense", expenseSegments: [], incomeSegments: {} };
  const isExpense = m.type === "expense";

  const activityFor = (lbl) => {
    if (["ซื้อที่ดิน อาคารและอุปกรณ์","ขายสินทรัพย์ถาวร","เงินลงทุนระยะสั้น (เพิ่ม)/ลด","เงินปันผลรับจากเงินลงทุน"].includes(lbl)) return "Investing";
    if (["เงินกู้ระยะสั้นเพิ่มขึ้น/(ลดลง)","เงินกู้ระยะยาว – รับ","เงินกู้ระยะยาว – ชำระคืน","จ่ายเงินปันผล"].includes(lbl)) return "Financing";
    return "Operating";
  };
  const activity = activityFor(label);
  const actColor = activity === "Operating" ? "#2A6FF0" : activity === "Investing" ? "#C97A00" : "#7C4DFF";

  // Local state for editing
  const [selExpSegs, setSelExpSegs] = React.useState(new Set(m.expenseSegments || []));
  const [selIncSegs, setSelIncSegs] = React.useState(() => {
    const init = {};
    Object.entries(m.incomeSegments || {}).forEach(([ent, segs]) => { init[ent] = new Set(segs); });
    return init;
  });

  const toggleExpSeg = (sid) => {
    setSelExpSegs(prev => {
      const next = new Set(prev);
      next.has(sid) ? next.delete(sid) : next.add(sid);
      return next;
    });
  };
  const toggleIncSeg = (entity, sid) => {
    setSelIncSegs(prev => {
      const next = { ...prev };
      const s = new Set(next[entity] || []);
      s.has(sid) ? s.delete(sid) : s.add(sid);
      next[entity] = s;
      return next;
    });
  };

  const handleSave = () => {
    const updated = { ...mapping };
    if (isExpense) {
      updated[label] = { ...m, expenseSegments: [...selExpSegs] };
    } else {
      const inc = {};
      Object.entries(selIncSegs).forEach(([ent, s]) => { if (s.size > 0) inc[ent] = [...s]; });
      updated[label] = { ...m, incomeSegments: inc };
    }
    setMapping(updated);
    toast && toast("บันทึก Mapping: " + label + " สำเร็จ");
    onClose();
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal lg" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="modal-title">แก้ไข CF Mapping</div>
            <div className="tiny muted" style={{ marginTop: 2 }}>{label}</div>
          </div>
          <span className="tag" style={{ marginLeft: 10, background: actColor + "1f", color: actColor }}>{activity}</span>
          <span className={"tag " + (isExpense ? "danger" : "success")} style={{ marginLeft: 6 }}>{isExpense ? "จ่าย (Expense)" : "รับ (Income)"}</span>
          <button className="iconbtn" style={{ marginLeft: "auto" }} onClick={onClose}><Ic name="x" size={16} /></button>
        </div>

        <div className="modal-body">
          {/* CF Line info */}
          <div style={{ padding: "10px 14px", background: "var(--bg-subtle)", borderRadius: 8, marginBottom: 16, borderLeft: "3px solid " + actColor }}>
            <div style={{ fontWeight: 600 }}>{label}</div>
            <div className="small muted" style={{ marginTop: 2 }}>
              {activity} Activity • {isExpense ? "เงินสดจ่าย" : "เงินสดรับ"} • เลือก Segment ที่ต้องการผูก
            </div>
          </div>

          {isExpense ? (
            /* Expense: checkboxes per expense segment */
            <div>
              <div className="small" style={{ fontWeight: 600, marginBottom: 10, color: "var(--text-secondary)" }}>
                Expense Segments (F1 / I1 / O1–O6)
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 8 }}>
                {d.expenseSegments.map(seg => {
                  const checked = selExpSegs.has(seg.id);
                  return (
                    <label key={seg.id}
                      className="row"
                      style={{
                        gap: 10, padding: "10px 12px",
                        border: "1px solid " + (checked ? seg.color : "var(--border)"),
                        borderRadius: 8, cursor: "pointer",
                        background: checked ? seg.color + "12" : "var(--bg)",
                        transition: "all 0.15s",
                      }}
                    >
                      <input type="checkbox" checked={checked} onChange={() => toggleExpSeg(seg.id)} />
                      <div style={{ minWidth: 0 }}>
                        <div className="row" style={{ gap: 6 }}>
                          <span className="mono small" style={{ fontWeight: 600, color: seg.color }}>{seg.id}</span>
                          <span style={{ fontWeight: 500 }}>{seg.name}</span>
                        </div>
                        <div className="tiny muted">
                          {seg.group === "F" ? "กิจกรรมจัดหาเงิน (Financing)" : seg.group === "I" ? "กิจกรรมลงทุน (Investing)" : "กิจกรรมดำเนินงาน (Operating)"}
                        </div>
                      </div>
                    </label>
                  );
                })}
              </div>
            </div>
          ) : (
            /* Income: checkboxes per company × segment */
            <div>
              <div className="small" style={{ fontWeight: 600, marginBottom: 10, color: "var(--text-secondary)" }}>
                Income Segments (แยกตามบริษัท)
              </div>
              {d.companies.filter(c => c.id !== "CONSO").map(co => {
                const segs = d.incomeSegmentsByCo[co.id] || [];
                if (segs.length === 0) return null;
                const coSel = selIncSegs[co.id] || new Set();
                return (
                  <div key={co.id} style={{ marginBottom: 12 }}>
                    <div className="row" style={{ gap: 8, marginBottom: 6 }}>
                      <EntityChip entity={co.id} />
                      <span className="small muted">{co.name}</span>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 6 }}>
                      {segs.map(seg => {
                        const checked = coSel.has(seg.id);
                        return (
                          <label key={seg.id}
                            className="row"
                            style={{
                              gap: 8, padding: "8px 10px",
                              border: "1px solid " + (checked ? co.color : "var(--border)"),
                              borderRadius: 7, cursor: "pointer",
                              background: checked ? co.color + "10" : "var(--bg)",
                              transition: "all 0.15s",
                            }}
                          >
                            <input type="checkbox" checked={checked} onChange={() => toggleIncSeg(co.id, seg.id)} />
                            <span className="small" style={{ fontWeight: checked ? 500 : 400 }}>{seg.name}</span>
                          </label>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <div className="modal-foot">
          <button className="btn" onClick={onClose}>ยกเลิก</button>
          <button className="btn primary" onClick={handleSave}><Ic name="check" size={13} /> บันทึก</button>
        </div>
      </div>
    </div>
  );
}

/* ----- CF Mapping Upload Modal ----- */
function CFMappingUploadModal({ onClose, onDone }) {
  const d = window.CFData;
  const [step, setStep] = React.useState(1);
  const [progress, setProgress] = React.useState(0);
  const [fileName, setFileName] = React.useState("CF_Mapping_Q2_2026.xlsx");

  React.useEffect(() => {
    if (step !== 2) return;
    setProgress(0);
    const t = setInterval(() => {
      setProgress(p => {
        if (p >= 100) { clearInterval(t); setTimeout(() => setStep(3), 300); return 100; }
        return p + 9;
      });
    }, 80);
    return () => clearInterval(t);
  }, [step]);

  // Simulated preview (using current mapping for demo)
  const previewRows = [];
  Object.entries(d.cfMapping).forEach(([label, m]) => {
    if (m.type === "expense") {
      (m.expenseSegments || []).forEach(sid => previewRows.push({ label, type: "Expense", entity: "*", sid, group: d.expenseSegments.find(x => x.id === sid)?.group || "—" }));
    } else {
      Object.entries(m.incomeSegments || {}).forEach(([entity, segs]) => {
        (segs || []).forEach(sid => previewRows.push({ label, type: "Income", entity, sid, group: "INC" }));
      });
    }
  });
  const valid = previewRows.length;
  const warnings = 0;
  const errors = 0;

  return (
    <div className="modal-backdrop" onClick={onClose}>

        <div className="modal-body">

                <div className="small muted">
                  <strong>คอลัมน์ที่ต้องมี:</strong> Activity, CF_Line, Type, Group, Entity, Segment_ID, Segment_Name<br />

                </div>
              </div>

              <div className="form-grid" style={{ marginTop: 14 }}>
                <label className="field"><span className="row" style={{ gap: 6 }}><input type="checkbox" defaultChecked />แทนที่ Mapping ปัจจุบัน</span></label>
                <label className="field"><span className="row" style={{ gap: 6 }}><input type="checkbox" defaultChecked />เก็บไฟล์เก่าเป็น Archive</span></label>
                <label className="field"><span className="row" style={{ gap: 6 }}><input type="checkbox" />ตรวจสอบเฉพาะ (Dry-run)</span></label>
                <label className="field"><span className="row" style={{ gap: 6 }}><input type="checkbox" defaultChecked />อัปเดต Mapping CF อัตโนมัติในรายงาน</span></label>
              </div>
            </>
          )}

          {step === 2 && (
            <div style={{ padding: "20px 4px" }}>
              <div style={{ fontWeight: 500 }}>กำลังตรวจสอบและประมวลผลไฟล์...</div>
              <div className="small muted" style={{ marginBottom: 14 }}>{fileName}</div>
              <div className="progress"><span style={{ width: progress + "%" }} /></div>
              <div className="row" style={{ justifyContent: "space-between", marginTop: 8 }}>
                <span className="small muted">
                  {progress < 30 ? "อ่านไฟล์ Excel..." :
                    progress < 60 ? "ตรวจสอบรูปแบบคอลัมน์..." :
                      progress < 90 ? "ตรวจสอบ Activity / Group / Segment..." : "เกือบเสร็จแล้ว..."}
                </span>
                <span className="small num">{Math.round(progress)}%</span>
              </div>

              <div style={{ marginTop: 18, border: "1px solid var(--border)", borderRadius: 8, padding: 14, background: "var(--bg-subtle)" }}>

                <div className="col" style={{ gap: 4, fontSize: 12 }}>

                      {progress > (i + 1) * 15 ? <Ic name="check" size={12} style={{ color: "var(--success)" }} /> : <span style={{ width: 12, height: 12, display: "inline-block", border: "1.5px solid var(--border-strong)", borderRadius: "50%" }} />}
                      <span>{s}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {step === 3 && (
            <>
              <div style={{ textAlign: "center", marginBottom: 18 }}>
                <div style={{ width: 48, height: 48, borderRadius: "50%", background: "var(--success-soft)", color: "var(--success)", display: "inline-grid", placeItems: "center", marginBottom: 8 }}>
                  <Ic name="check" size={22} />
                </div>
                <div style={{ fontSize: 15, fontWeight: 600 }}>ตรวจสอบไฟล์เรียบร้อย</div>
                <div className="muted small" style={{ marginTop: 2 }}>{fileName} • {valid} แถว</div>
              </div>

              <div className="row" style={{ justifyContent: "center", gap: 24, marginBottom: 18 }}>
                <Stat label="ผ่านการตรวจ" value={String(valid)} color="var(--success)" />
                <Stat label="คำเตือน" value={String(warnings)} color="var(--warning)" />
                <Stat label="ผิดพลาด" value={String(errors)} color="var(--danger)" />
              </div>

              <div style={{ border: "1px solid var(--border)", borderRadius: 8, maxHeight: 280, overflow: "auto" }}>
                <table className="tbl" style={{ fontSize: 12 }}>
                  <thead>
                    <tr>
                      <th>CF Line</th>
                      <th>Activity</th>
                      <th>Type</th>
                      <th>Group</th>
                      <th>Entity</th>
                      <th>Segment</th>
                    </tr>
                  </thead>
                  <tbody>
                    {previewRows.slice(0, 50).map((r, i) => {
                      const act = ["ซื้อที่ดิน อาคารและอุปกรณ์","ขายสินทรัพย์ถาวร","เงินลงทุนระยะสั้น (เพิ่ม)/ลด","เงินปันผลรับจากเงินลงทุน"].includes(r.label) ? "Investing"
                        : ["เงินกู้ระยะสั้นเพิ่มขึ้น/(ลดลง)","เงินกู้ระยะยาว – รับ","เงินกู้ระยะยาว – ชำระคืน","จ่ายเงินปันผล"].includes(r.label) ? "Financing"
                        : "Operating";
                      const ac = act === "Operating" ? "#2A6FF0" : act === "Investing" ? "#C97A00" : "#7C4DFF";
                      return (
                        <tr key={i}>
                          <td>{r.label}</td>
                          <td><span className="tag" style={{ background: ac + "1f", color: ac }}>{act}</span></td>
                          <td>{r.type === "Income" ? <span className="tag success">{r.type}</span> : <span className="tag danger">{r.type}</span>}</td>
                          <td><span className="tag segment-tag mono" style={{ fontSize: 10.5 }}>{r.group}</span></td>
                          <td>{r.entity === "*" ? <span className="faint mono small">*</span> : <EntityChip entity={r.entity} />}</td>
                          <td className="mono small">{r.sid}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </>
          )}
        </div>
        <div className="modal-foot">
          {step === 1 && <>
            <button className="btn" onClick={onClose}>ยกเลิก</button>
            <button className="btn primary" onClick={() => setStep(2)}><Ic name="upload" size={13} /> ประมวลผล</button>
          </>}
          {step === 3 && <>
            <button className="btn" onClick={onClose}>ยกเลิก</button>
            <button className="btn primary" onClick={() => onDone(d.cfMapping, fileName)}><Ic name="check" size={13} /> นำมาใช้งาน</button>
          </>}
        </div>
      </div>
    </div>
  );
}

/* Reusable Mini KPI override for non-currency */
function MiniStat({ label, value, color, accent, raw }) {
  return (
    <div className="kpi" style={{ padding: "12px 14px", gap: 2 }}>
      <div className="kpi-label">{label}</div>
      <div className="kpi-value" style={{ fontSize: 20, color: accent ? "var(--accent)" : color || "var(--text)" }}>
        {raw ? value : window.fmtTHB(value)}
      </div>
    </div>
  );
}
